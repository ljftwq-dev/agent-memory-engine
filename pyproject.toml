[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-engine-ljf"
version = "0.1.0"
description = "Two-stage retrieval + gating long-term memory engine for coding agents."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "ljftwq-dev", email = "ljftwq-dev@users.noreply.github.com"}]
keywords = ["agent", "memory", "llm", "rag", "vector-search", "sqlite", "coding-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "sqlite-vec>=0.1.1",
    "numpy>=1.21",
]

[project.optional-dependencies]
# Real semantic embedding (default model: BGE-m3). Optional because the engine
# still runs (with a hash fallback, no real semantics) without it.
embed = [
    "sentence-transformers>=2.2",
    "modelscope>=1.10",
]
# Cross-encoder precision rerank (default model: bge-reranker-v2-m3). Sits after
# hybrid fusion in recall; gracefully skipped if the model isn't loaded.
reranker = [
    "sentence-transformers>=2.2",
    "modelscope>=1.10",
]
# MCP server: expose the engine to MCP-capable IDEs (opencode / ZCode / Claude
# Code). A thin HTTP proxy - needs the HTTP server (server.py) running.
mcp = [
    "mcp>=1.0",
]
# LLM summarization uses only the stdlib urllib, no extra deps needed.
dev = ["pytest>=7.0"]
all = [
    "sentence-transformers>=2.2",
    "modelscope>=1.10",
    "mcp>=1.0",
    "pytest>=7.0",
]

[project.scripts]
agent-memory = "engine.server:main"
agent-memory-mcp = "engine.mcp_server:main"

[project.urls]
Homepage = "https://github.com/ljftwq-dev/agent-memory-engine"
Issues = "https://github.com/ljftwq-dev/agent-memory-engine/issues"

[tool.setuptools]
packages = ["engine"]
